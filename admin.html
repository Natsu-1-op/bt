<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频眨眼对照</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0a1422;color:#e9f1fc}
body{max-width:850px;margin:auto;padding:20px}h1{font-size:1.6rem}
section{background:#112035;border:1px solid #263c55;border-radius:12px;padding:16px;margin:12px 0}
p{color:#b8c8df;line-height:1.5}label{display:grid;gap:5px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
input,button{box-sizing:border-box;font:inherit;max-width:100%;padding:8px;background:#1b314c;color:inherit;border:1px solid #446583;border-radius:7px}
input[type=number]{width:7em}button:disabled{opacity:.5}video{display:block;width:100%;max-height:360px;background:#000;margin-top:12px}
#reviewResults details{margin-top:12px}#reviewStatus{min-height:1.5em}
</style>
</head>
<body>
<h1>视频眨眼对照</h1>
<p>选择同一受试者的录像和研究数据。视频在本机处理，检测模型需联网加载。</p>
<section>
<div class="row">
<label>现场视频<input id="reviewVideo" type="file" accept="video/*,.mp4,.mov"></label>
<label>研究记录<input id="reviewData" type="file" accept=".json,application/json"></label>
</div>
<video id="reviewMedia" controls muted playsinline preload="metadata"></video>
</section>
<section>
<label>视频第 0 秒的北京时间
<input id="reviewStartTime" type="datetime-local" step=".001">
</label>
<p>填写实际拍摄时间。系统会分析录像和采集的重叠部分。</p>
<div id="reviewCues" hidden>
<h2 style="font-size:1rem">用两次同步闪光对时</h2>
<p id="reviewCueText"></p>
<div class="row">
<label>第一次闪光（秒）<input id="reviewCueFirst" type="number" min="0" step=".001"></label><button id="reviewSetFirst">取当前位置</button>
<label>最后一次闪光（秒）<input id="reviewCueLast" type="number" min="0" step=".001"></label><button id="reviewSetLast">取当前位置</button>
</div></div>
<details>
<summary>更多对时与分析选项</summary>
<div class="row" style="margin-top:10px">
<label>上述北京时间对应视频第几秒<input id="reviewAnchor" type="number" value="0" min="0" step=".001"></label>
<button id="reviewUseTime">取当前播放位置</button>
<label>起始秒（可空）<input id="reviewFrom" type="number" min="0" step=".1"></label>
<label>结束秒（可空）<input id="reviewTo" type="number" min="0" step=".1"></label>
<label>闭眼比例<input id="reviewRatio" type="number" value=".70" min=".4" max=".9" step=".01"></label>
</div>
</details>
<div class="row" style="margin-top:12px"><button id="reviewScan">分析并对比</button><button id="reviewCancel" disabled>停止</button><button id="reviewSave" disabled>保存对照</button></div>
<p id="reviewStatus" role="status">请先选择视频、研究记录并填写时间。</p>
<div id="reviewResults"></div>
</section>
<script src="video-review.js?v=20261114-2"></script>
</body>
</html>
