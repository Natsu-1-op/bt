<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>眨眼测试</title>
<link rel="stylesheet" href="blink.css?v=20261114-3">
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="appTitle">眨眼测试</h1>
      <div class="top"><span id="dot" class="dot"></span><span id="conn">请先连接采集设备。</span></div>
    </div>
    <button id="btnConn" class="primary">连接设备</button>
  </header>

  <section class="card">
    <div class="identity field"><label for="subjectId">受试者编号</label><input id="subjectId" type="text" maxlength="64" placeholder="例如 26"></div>
    <div class="controls">
      <button id="btnStart" class="primary" disabled>开始测试</button>
      <button id="btnPause" class="warn" disabled>暂停测试</button>
      <button id="btnStop" class="danger" disabled>结束测试</button>
      <button id="btnExportBundle" class="ghost" disabled>导出数据</button>
    </div>
    <p class="note" id="help">佩戴后等波形稳定再开始。准备时请保持睁眼，结束后导出数据。</p>
  </section>

  <section class="grid" style="margin-bottom:10px">
    <div class="metric"><label>状态</label><strong id="mState" class="badc">待机</strong></div>
    <div class="metric"><label>本次眨眼次数</label><strong id="mCount" class="good">0</strong></div>
    <div class="metric"><label>近 30 秒次数</label><strong id="mBpm" class="bluec">--</strong></div>
    <div class="metric"><label>最近一次眨眼</label><strong id="mLast" class="warnc">--</strong></div>
  </section>

  <section class="card scope">
    <canvas id="scope" aria-label="采集波形"></canvas>
    <div class="legend">
      <span style="--series:#38d996">处理后</span><span style="--series:#8ea3bd">原始</span><span style="--series:#f4bf4f">眨眼标记</span>
      <label><input id="autoRange" type="checkbox" checked>自动量程</label>
    </div>
  </section>


  <section class="card optional" aria-label="补充设置">
    <details><summary>与录像对时</summary>
      <p class="note">让录像拍到下方提示区，在计数开始后和结束前各点一次。闪光会记在本次数据里。</p>
      <button id="btnVideoSync" class="ghost" disabled>发出同步闪光</button>
      <div id="videoSyncCue" role="status" style="min-height:3rem;padding:10px;margin-top:8px;background:#15243a;color:#fff;border-radius:8px">等待同步</div>
    </details>
    <details><summary>补充记录信息</summary>
    <div class="fields">
      <div class="field"><label>设备编号</label><input id="deviceId" type="text" maxlength="64" placeholder="例如 EOG-01"></div>
      <div class="field"><label>操作者</label><input id="operatorId" type="text" maxlength="64" placeholder="姓名或编号"></div>
    </div>
    <div class="fields">
      <div class="field"><label>测试备注</label><input id="condition" type="text" maxlength="160" placeholder="例如 常规测试"></div>
    </div>
    </details>
  </section>


  <details class="card">
    <summary>本机记录</summary>
    <div class="field"><label for="sessionList">本机保存的测试</label><select id="sessionList"><option value="">当前测试</option></select>
      <div class="record-actions">
        <button id="btnLoad" class="primary">打开所选测试</button>
        <button id="btnExportOne" class="ghost" disabled>导出这条</button>
        <button id="btnExportAll" class="ghost" disabled>导出全部</button>
        <button id="btnDeleteSession" class="danger" disabled>删除这条</button>
        <button id="btnClear" class="ghost" disabled>清除当前显示</button>
      </div>
    </div>
    <details id="frequencyPanel"><summary>区间统计</summary>
    <div class="fields">
      <div class="field"><label>起始秒</label><input id="fT0" type="number" value="0" min="0" step="1"></div>
      <div class="field"><label>结束秒</label><input id="fT1" type="number" value="0" min="0" step="1"></div>
      <div class="field"><label>统计时长（秒）</label><input id="fWin" type="number" value="30" min="5" step="5"></div>
      <div class="field"><label>统计步长（秒）</label><input id="fStep" type="number" value="5" min="1" step="1"></div>
    </div>
    <div class="row" style="margin-bottom:9px">
      <button id="btnAnalyze" class="primary" disabled>查看结果</button>
      <button id="btnFull" class="ghost" disabled>使用整段测试</button>
    </div>
    <div id="freqWrap"><canvas id="freq"></canvas></div>
    <div class="summary">
      <div>区间平均频率<b id="sAvg">--</b></div>
      <div>区间眨眼次数<b id="sCount">--</b></div>
      <div>记录时长<b id="sDur">--</b></div>
      <div>窗口数<b id="sWin">--</b></div>
    </div>
    </details>
  </details>

  <div id="cloudGate" class="cloud-gate hidden">
    <div class="cloud-box">
      <div id="cloudSpin" class="cloud-spin"></div>
      <h3 id="cloudTitle">正在云端同步…</h3>
      <p id="cloudMsg" class="note" style="margin:0">正在获取控制台设置，请稍候。</p>
      <div id="cloudActions" class="cloud-actions">
        <button id="cloudStart" class="primary" type="button">直接开始测试</button>
        <button id="cloudCancel" class="ghost" type="button">取消</button>
      </div>
    </div>
  </div>
</main>

<script src="blink-app.js?v=20261114-3"></script>
</body>
</html>
