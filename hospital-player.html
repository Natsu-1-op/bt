<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>眨眼记录播放器</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0a1422;color:#e9f1fc}
body{max-width:1050px;margin:auto;padding:20px}h1{font-size:1.55rem;margin:0}
section{border:1px solid #263c55;background:#112035;border-radius:14px;margin:16px 0;padding:16px}
p{line-height:1.55;color:#b8c8df}label{display:inline-grid;gap:6px}input,select,button{font:inherit;min-width:0}
input[type=file],select,button{background:#1b314c;color:inherit;border:1px solid #446583;border-radius:8px;padding:9px}
button:disabled,select:disabled{opacity:.5}canvas{display:block;width:100%;height:270px;background:#08111e;border-radius:9px}
.row{display:flex;align-items:end;flex-wrap:wrap;gap:12px}#seek{width:100%;margin:14px 0}
#clock{font-variant-numeric:tabular-nums}#status{min-height:1.5em}
@media(max-width:540px){body{padding:10px}section{padding:12px}canvas{height:210px}.row label{max-width:100%}}
</style>
</head>
<body>
<h1>眨眼记录播放器</h1><p>波形回放 · 北京时间</p>
<section>
<div class="row"><label>导入播放数据<input id="file" type="file" accept=".json,application/json"></label>
<label>选择记录<select id="record" disabled></select></label></div>
<p id="status" role="status">请选择配套的播放数据文件。</p>
</section>
<section>
<div class="row"><button id="play" disabled>播放</button><button id="prev" disabled>上一个标记</button><button id="next" disabled>下一个标记</button>
<label>倍速<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<input id="seek" aria-label="播放进度" type="range" min="0" max="0" value="0" step="1" disabled>
<p id="clock" aria-live="off">尚未导入</p>
<canvas id="wave" aria-label="显示波形与眨眼标记"></canvas>
<p>绿线：显示波形；黄线：眨眼标记；空白：无采样。</p>
</section>
<script>
'use strict';
const $=id=>document.getElementById(id), c=$('wave'), ctx=c.getContext('2d');
let records=[], r=null, pos=0, playing=false, stamp=0, generation=0;
const fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'medium',timeStyle:'medium',hourCycle:'h23'});
function validateDisplay(input){
  if(input?.schema!=='blink-display/v1'||input.step_ms!==40||!Array.isArray(input.records)||!input.records.length||input.records.length>500)
    throw Error('文件格式不匹配，请选择配套的播放数据。');
  let points=0;
  for(const x of input.records){
    if(!x || !/^\d{1,4}$/.test(x.subject)||!/^R\d+$/.test(x.record)||!Number.isFinite(Date.parse(x.beijing_start))||
      !Number.isFinite(x.duration_ms)||x.duration_ms<0||x.duration_ms>86400000||!Array.isArray(x.segments)||!Array.isArray(x.marks))
      throw Error('播放记录格式无效。');
    let end=-1;
    for(const s of x.segments){
      if(!s||!Number.isFinite(s.start_ms)||!Number.isFinite(s.end_ms)||s.start_ms<end||s.end_ms<s.start_ms||s.end_ms>x.duration_ms||
        !Number.isFinite(Date.parse(s.beijing_start))||!Array.isArray(s.trace)||
        s.trace.length>Math.floor((s.end_ms-s.start_ms)/40)+2||s.trace.some(v=>v!==null&&(!Number.isInteger(v)||v< -31||v>31)))throw Error('显示波形无效。');
      end=s.end_ms;points+=s.trace.length;
    }
    if(x.marks.some((t,i)=>!Number.isFinite(t)||t<0||t>x.duration_ms||(i&&t<x.marks[i-1])))throw Error('标记时间无效。');
  }
  if(points>2000000)throw Error('文件过大，请分批播放。');
  return input.records;
}
function selectRecord(i){
  r=records[i];playing=false;pos=0;
  $('seek').max=r.duration_ms;
  for(const id of ['play','prev','next','seek'])$(id).disabled=false;
  $('status').textContent=(r.incomplete?'部分记录 · ':'已打开 · ')+r.marks.length+' 个眨眼标记';
  draw();
}
$('file').onchange=async()=>{
  const file=$('file').files[0], g=++generation;if(!file)return;
  try{
    if(file.size>16*1024*1024)throw Error('文件过大，请选择配套的播放数据。');
    const data=validateDisplay(JSON.parse(await file.text()));if(g!==generation)return;
    records=data;$('record').replaceChildren(...records.map((x,i)=>new Option('受试者 '+x.subject+' · '+fmt.format(Date.parse(x.beijing_start))+' · '+x.record,i)));
    $('record').disabled=false;selectRecord(0);
  }catch(e){if(g===generation)$('status').textContent=e.message;}
};
$('record').onchange=()=>selectRecord(Number($('record').value));
function seek(ms){if(!r)return;pos=Math.min(r.duration_ms,Math.max(0,ms));stamp=performance.now();draw();}
$('seek').oninput=()=>seek(Number($('seek').value));
$('play').onclick=()=>{if(!r)return;if(!playing&&pos>=r.duration_ms)seek(0);playing=!playing;stamp=performance.now();draw();};
$('prev').onclick=()=>{const t=r?.marks.findLast(t=>t<pos-1);if(t!==undefined)seek(t);};
$('next').onclick=()=>{const t=r?.marks.find(t=>t>pos+1);if(t!==undefined)seek(t);};
function draw(){
  const w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio||1,2);
  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#233952';for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,h*i/5);ctx.lineTo(w,h*i/5);ctx.stroke();}
  if(!r)return;
  const left=Math.max(0,pos-7500),right=left+8000,x=t=>(t-left)*w/(right-left);
  ctx.strokeStyle='#38d996';ctx.lineWidth=1.6;
  for(const s of r.segments){
    if(s.end_ms<left||s.start_ms>right)continue;
    ctx.beginPath();let open=false;
    for(let i=Math.max(0,Math.ceil((left-s.start_ms)/40));i<s.trace.length&&s.start_ms+i*40<=right;i++){
      const v=s.trace[i];if(v===null){open=false;continue;}
      const y=h/2-v*h/75;
      if(open)ctx.lineTo(x(s.start_ms+i*40),y);else ctx.moveTo(x(s.start_ms+i*40),y);
      open=true;
    }
    ctx.stroke();
  }
  ctx.strokeStyle='#f3c75c';ctx.lineWidth=1;
  for(const t of r.marks)if(t>=left&&t<=right){ctx.beginPath();ctx.moveTo(x(t),0);ctx.lineTo(x(t),h);ctx.stroke();}
  ctx.strokeStyle='#84b7ff';ctx.beginPath();ctx.moveTo(x(pos),0);ctx.lineTo(x(pos),h);ctx.stroke();
  const segment=r.segments.find(s=>pos>=s.start_ms&&pos<=s.end_ms);
  const time=segment?fmt.format(Date.parse(segment.beijing_start)+pos-segment.start_ms):'无采样';
  $('clock').textContent=time+' · '+(pos/1000).toFixed(2)+' / '+(r.duration_ms/1000).toFixed(2)+' 秒 · '+r.marks.filter(t=>t<=pos).length+' 个标记';
  $('seek').value=Math.round(pos);$('play').textContent=playing?'暂停':'播放';
}
function frame(now){if(playing&&r){pos=Math.min(r.duration_ms,pos+(now-stamp)*Number($('speed').value));stamp=now;if(pos>=r.duration_ms)playing=false;draw();}requestAnimationFrame(frame);}
window.addEventListener('resize',draw);requestAnimationFrame(frame);draw();
</script>
</body>
</html>
